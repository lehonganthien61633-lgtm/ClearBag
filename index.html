<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Clearbag</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebarOverlay" onclick="app.toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-slate-800 text-white w-64 flex-col fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out z-30 flex">
        <div class="p-5 border-b border-slate-700 text-xl font-bold flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-regular fa-folder-open text-blue-400"></i> Kho Clearbag
            </div>
            <button onclick="app.toggleSidebar()" class="md:hidden text-gray-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="app.switchView('dashboard')" id="nav-dashboard" class="nav-btn w-full text-left px-4 py-3 rounded bg-blue-600 text-white transition-colors"><i class="fa-solid fa-chart-pie w-6"></i> Tổng quan</button>
            <button onclick="app.switchView('clearbags')" id="nav-clearbags" class="nav-btn w-full text-left px-4 py-3 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition-colors"><i class="fa-solid fa-box w-6"></i> Clearbag</button>
            <button onclick="app.switchView('subjects')" id="nav-subjects" class="nav-btn w-full text-left px-4 py-3 rounded text-gray-300 hover:bg-slate-700 hover:text-white transition-colors"><i class="fa-solid fa-book w-6"></i> Quản lý môn học</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden w-full">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
            <div class="flex items-center gap-3">
                <button onclick="app.toggleSidebar()" class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <h2 id="pageTitle" class="text-xl font-bold text-gray-800">Tổng quan</h2>
            </div>
            <div class="flex gap-2">
                <button onclick="app.openScanModal()" class="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-medium hover:bg-purple-700 transition-colors shadow-sm">
                    <i class="fa-solid fa-qrcode mr-1"></i> Quét mã
                </button>
                <button onclick="app.openModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors shadow-sm">
                    <i class="fa-solid fa-plus mr-1"></i> Thêm Túi
                </button>
            </div>
        </header>

        <div class="p-4 md:p-6 overflow-y-auto flex-1">
            
            <!-- Dashboard View -->
            <div id="view-dashboard" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-gray-500 text-sm font-medium">Tổng số lượng túi</p>
                        <p id="stat-total" class="text-3xl font-bold mt-1 text-gray-800">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                        <p class="text-gray-500 text-sm font-medium">Tổng giá trị</p>
                        <p id="stat-value" class="text-3xl font-bold mt-1 text-gray-800">0 ₫</p>
                    </div>
                </div>
            </div>

            <!-- Clearbags View -->
            <div id="view-clearbags" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex-col h-full">
                <div class="p-4 border-b border-gray-200 bg-gray-50 flex gap-2">
                    <div class="relative w-full md:w-1/3 shrink-0">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="searchInput" placeholder="Tìm tên, mã túi..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                    </div>
                </div>
                <!-- Sửa overflow-auto để cuộn bảng mượt trên mobile -->
                <div class="overflow-auto flex-1">
                    <table class="w-full text-left whitespace-nowrap md:whitespace-normal">
                        <thead class="bg-gray-100 text-gray-600 text-xs md:text-sm uppercase tracking-wider sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="px-4 md:px-6 py-3 font-medium">Mã</th>
                                <th class="px-4 md:px-6 py-3 font-medium">Loại</th>
                                <th class="px-4 md:px-6 py-3 font-medium">Tên túi</th>
                                <th class="px-4 md:px-6 py-3 font-medium hidden sm:table-cell">Thông tin Môn học</th>
                                <th class="px-4 md:px-6 py-3 font-medium text-center">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-100 bg-white text-sm"></tbody>
                    </table>
                </div>
            </div>

            <!-- Subjects View (Read-only) -->
            <div id="view-subjects" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex-col h-full">
                <div class="p-4 border-b border-gray-200 flex flex-wrap gap-2 md:gap-4 items-center bg-gray-50 shrink-0">
                    <label class="font-bold text-gray-700 text-sm md:text-base">Học Kỳ:</label>
                    <select id="filterSemester" onchange="app.renderSubjects()" class="px-3 md:px-4 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-blue-700 min-w-[120px] shadow-sm text-sm">
                        <!-- Rendered by JS -->
                    </select>
                </div>
                <!-- Sửa overflow-auto để cuộn bảng mượt trên mobile -->
                <div class="overflow-auto flex-1">
                    <table class="w-full text-left whitespace-nowrap md:whitespace-normal">
                        <thead class="bg-gray-100 text-gray-600 text-xs md:text-sm uppercase tracking-wider sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="px-4 md:px-6 py-3 font-medium">Mã MH</th>
                                <th class="px-4 md:px-6 py-3 font-medium">Tên Môn Học</th>
                                <th class="px-4 md:px-6 py-3 font-medium hidden sm:table-cell">Lịch học</th>
                                <th class="px-4 md:px-6 py-3 font-medium text-center">HK</th>
                            </tr>
                        </thead>
                        <tbody id="subjectsTableBody" class="divide-y divide-gray-100 bg-white text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Main Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 max-h-[95vh] overflow-y-auto">
            <h3 class="text-xl font-bold mb-5 text-gray-800 border-b pb-2" id="modalTitle">Thêm Clearbag</h3>
            <form id="bagForm" class="space-y-4" onsubmit="return false;">
                <input type="hidden" id="bagId">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Mã Túi</label>
                    <input type="text" id="bagCode" readonly class="w-full px-3 py-2 border rounded-lg bg-gray-100 text-gray-500 outline-none cursor-not-allowed font-bold">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phân loại <span class="text-red-500">*</span></label>
                        <select id="bagType" onchange="app.toggleTypeFields()" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="mon_hoc">Môn học</option>
                            <option value="tai_lieu">Tài liệu</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tên Clearbag <span class="text-red-500">*</span></label>
                        <input type="text" id="bagName" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="Nhập tên túi...">
                    </div>
                </div>
                
                <!-- Dynamic Subject Fields -->
                <div id="subjectFields" class="p-4 bg-blue-50/50 rounded-lg border border-blue-100 space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Mã MH <span class="text-red-500">*</span></label>
                            <input type="text" id="subjectCode" maxlength="6" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 uppercase placeholder-gray-400" placeholder="VD: CH1001">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Học kỳ</label>
                            <input type="text" id="semester" readonly class="w-full px-3 py-2 border rounded-lg bg-gray-200/60 text-gray-700 outline-none font-bold text-center">
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-medium text-gray-700">Lịch học <span class="text-red-500">*</span></label>
                            <button type="button" onclick="app.addScheduleRow()" class="text-xs bg-green-500 text-white px-3 py-1.5 rounded-md hover:bg-green-600 font-semibold shadow-sm transition-colors"><i class="fa-solid fa-plus"></i> Thêm ngày</button>
                        </div>
                        <div id="scheduleContainer" class="space-y-2 max-h-40 overflow-y-auto no-scrollbar border p-2 rounded-lg bg-white shadow-inner">
                            <!-- Schedules rendered here -->
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6 pt-4 border-t">
                    <button type="button" onclick="app.closeModal()" class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium transition-colors">Hủy</button>
                    <button type="button" onclick="app.saveData()" class="px-5 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium shadow-sm transition-colors">Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Chọn Tuần Học -->
    <div id="weekModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl p-5 w-full max-w-sm">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h4 class="font-bold text-lg text-gray-800">Nhập tuần học</h4>
                <span id="weekModalSemester" class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">HK: N/A</span>
            </div>
            
            <div id="weekRangesContainer" class="space-y-3 max-h-48 overflow-y-auto no-scrollbar mb-4 p-1">
                <!-- Các khoảng tuần sẽ render tại đây -->
            </div>
            
            <button type="button" onclick="app.addWeekRange()" class="w-full mb-6 border border-dashed border-blue-400 text-blue-600 bg-blue-50 hover:bg-blue-100 py-2 rounded-lg text-sm font-semibold transition-colors flex items-center justify-center gap-1">
                <i class="fa-solid fa-plus"></i> Thêm khoảng tuần
            </button>
            
            <div class="flex justify-end gap-3 pt-4 border-t">
                <button onclick="app.closeWeekModal()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200">Hủy</button>
                <button onclick="app.saveWeeks()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 shadow-sm">Lưu tuần</button>
            </div>
        </div>
    </div>

   <!-- Modal In Nhãn -->
    <div id="printModal" class="fixed inset-0 bg-black/50 z-[55] hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
            <h3 class="text-lg font-bold mb-4">In Nhãn Clearbag</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Kích thước nhãn in</label>
                <select id="printSize" class="w-full px-3 py-2 border rounded outline-none focus:ring-2 focus:ring-blue-500 mb-3">
                    <option value="40x30">40x30 mm</option>
                    <option value="45x30">45x30 mm</option>
                </select>
                <label class="flex items-center gap-2 cursor-pointer border p-2 rounded bg-gray-50">
                    <input type="checkbox" id="printOnlyQR" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm font-bold text-gray-700">Chỉ in mã QR</span>
                </label>
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button type="button" onclick="app.closePrintModal()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Hủy</button>
                <button type="button" onclick="app.executePrint()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700"><i class="fa-solid fa-print"></i> In Nhãn</button>
            </div>
        </div>
    </div>

    <!-- Modal Quét QR Kiểm Tra (Chỉ Camera) -->
    <div id="scanModal" class="fixed inset-0 bg-black/80 z-[70] hidden flex items-center justify-center p-3 md:p-4">
        <div class="bg-white rounded-xl shadow-2xl p-4 md:p-5 w-full max-w-sm flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-3 border-b pb-2 shrink-0">
                <h4 class="font-bold text-base md:text-lg text-gray-800"><i class="fa-solid fa-qrcode text-purple-600 mr-2"></i>Quét QR Clearbag</h4>
                <button onclick="app.closeScanModal()" class="text-gray-400 hover:text-gray-800 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="flex-1 space-y-3 overflow-y-auto no-scrollbar pb-2">
                <p class="text-xs text-center text-gray-500">Đưa mã QR trên túi vào giữa khung hình.</p>
                
                <!-- Khu vực quét Camera tự co giãn trên mobile -->
                <div id="reader-container" class="rounded-lg overflow-hidden border-2 border-purple-200 bg-black relative flex items-center justify-center min-h-[250px] md:min-h-[300px]">
                    <div id="reader" style="width: 100%; border: none;"></div>
                </div>

                <div id="scanResult" class="min-h-[70px] md:min-h-[90px] text-xs md:text-sm font-medium p-3 md:p-4 rounded-lg bg-gray-50 text-gray-600 border border-gray-200 flex items-center justify-center transition-all duration-300">
                    Chờ quét mã...
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Chọn Tuần Học -->
    <div id="weekModal" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <h3 class="text-lg font-bold mb-4">Chọn Tuần Học</h3>
            <div id="weekGrid" class="grid grid-cols-5 gap-2 max-h-48 overflow-y-auto p-1">
            </div>
            <div class="flex justify-end gap-3 mt-6">
                <button type="button" onclick="app.closeWeekModal()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Hủy</button>
                <button type="button" onclick="app.saveWeeks()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        class ClearbagApp {
            constructor() {
                this.bags = [];
                this.search = '';
                this.currentSchedules = []; 
                this.currentScheduleIndex = 0;
                this.currentPrintId = null;
                
                // Cấu hình Database
                const firebaseConfig = { 
                    databaseURL: "https://clearbag-188b6-default-rtdb.asia-southeast1.firebasedatabase.app/" 
                };
                const fbApp = initializeApp(firebaseConfig);
                this.db = getDatabase(fbApp);
                this.bagsRef = ref(this.db, 'clearbags');

                this.init();
            }

            init() {
                onValue(this.bagsRef, (snapshot) => {
                    this.bags = [];
                    if (snapshot.exists()) {
                        snapshot.forEach((child) => {
                            this.bags.push({ id: child.key, ...child.val() });
                        });
                    }
                    this.render();
                    this.updateSemesterFilter(); 
                });

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.search = e.target.value.toLowerCase();
                    this.render();
                });

                document.getElementById('subjectCode').addEventListener('input', function(e) {
                    let val = e.target.value;
                    val = val.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    val = val.replace(/[^A-Za-z0-9]/g, '');
                    e.target.value = val.toUpperCase().substring(0, 6);
                });
                
                // Đã XÓA phần document.getElementById('scanInput').addEventListener...
            }

            // --- CÁC HÀM TIỆN ÍCH DÙNG CHUNG ---
            getCurrentISOWeek(date = new Date()) {
                const target = new Date(date.valueOf());
                const dayNr = (date.getDay() + 6) % 7;
                target.setDate(target.getDate() - dayNr + 3);
                const firstThursday = target.valueOf();
                target.setMonth(0, 1);
                if (target.getDay() !== 4) {
                    target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
                }
                return 1 + Math.ceil((firstThursday - target) / 604800000);
            }

            getCurrentDayString() {
                const days = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'];
                return days[new Date().getDay()];
            }

            parseWeeks(weekStr) {
                if (!weekStr) return [];
                let result = [];
                const parts = weekStr.split(',');
                parts.forEach(p => {
                    const range = p.trim().split('-');
                    if(range.length === 2) {
                        for(let i = parseInt(range[0]); i <= parseInt(range[1]); i++) result.push(i);
                    } else if(range.length === 1) {
                        result.push(parseInt(range[0]));
                    }
                });
                return result;
            }

            // --- GIAO DIỆN & TƯƠNG TÁC CHÍNH ---
            toggleSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebarOverlay');
                if (sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.remove('-translate-x-full');
                    overlay.classList.remove('hidden');
                } else {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }

            switchView(view) {
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('text-gray-300', 'hover:bg-slate-700', 'hover:text-white');
                });
                document.getElementById(`nav-${view}`).classList.remove('text-gray-300', 'hover:bg-slate-700');
                document.getElementById(`nav-${view}`).classList.add('bg-blue-600', 'text-white');

                document.getElementById('view-dashboard').classList.add('hidden');
                document.getElementById('view-clearbags').classList.add('hidden');
                document.getElementById('view-subjects').classList.add('hidden');
                document.getElementById(`view-${view}`).classList.remove('hidden');
                
                const titles = { 'dashboard': 'Tổng quan', 'clearbags': 'Danh sách Clearbag', 'subjects': 'Quản lý Môn học' };
                document.getElementById('pageTitle').innerText = titles[view];

                if (window.innerWidth < 768) this.toggleSidebar();
                if(view === 'subjects') this.renderSubjects();
            }

            toggleTypeFields() {
                const type = document.getElementById('bagType').value;
                const subjectFields = document.getElementById('subjectFields');
                if (type === 'mon_hoc') {
                    subjectFields.classList.remove('hidden');
                    document.getElementById('semester').value = this.calculateSemester();
                } else {
                    subjectFields.classList.add('hidden');
                }
            }

            calculateSemester() {
                const now = new Date();
                const month = now.getMonth() + 1; 
                const year = now.getFullYear();
                let startYearShort = '';
                let semesterSuffix = '';

                if (month >= 9 && month <= 12) {
                    startYearShort = year.toString().slice(-2);
                    semesterSuffix = '1';
                } else if (month >= 1 && month < 6) {
                    startYearShort = (year - 1).toString().slice(-2);
                    semesterSuffix = '2';
                } else if (month >= 6 && month < 9) {
                    startYearShort = (year - 1).toString().slice(-2);
                    semesterSuffix = '3';
                }
                return `${startYearShort}${semesterSuffix}`;
            }

            generateRandomCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let res = 'CB-';
                for(let i=0; i<5; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
                return res;
            }

            render() {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                let totalBags = 0;

                this.bags.forEach(bag => {
                    totalBags++;
                    if (bag.name.toLowerCase().includes(this.search) || bag.code.toLowerCase().includes(this.search)) {
                        const typeLabel = bag.type === 'mon_hoc' ? '<span class="bg-blue-100 text-blue-700 px-1.5 md:px-2 py-1 rounded text-[10px] md:text-xs font-bold">Môn học</span>' : '<span class="bg-gray-200 text-gray-700 px-1.5 md:px-2 py-1 rounded text-[10px] md:text-xs font-bold">Tài liệu</span>';
                        
                        let extraInfo = '';
                        if (bag.type === 'mon_hoc') {
                            let scheduleHtml = '';
                            if(bag.schedules && Array.isArray(bag.schedules)) {
                                scheduleHtml = bag.schedules.map(s => {
                                    const wInfo = s.weeks ? `<span class="text-[10px] bg-yellow-100 text-yellow-800 px-1 rounded ml-1 border border-yellow-200">T:${s.weeks}</span>` : '';
                                    return `<div class="mt-0.5 flex items-center whitespace-nowrap"><i class="fa-regular fa-clock w-3 mr-1"></i> ${s.day}, ${s.start}-${s.end} ${wInfo}</div>`;
                                }).join('');
                            }
                            extraInfo = `
                                <div class="text-[11px] md:text-xs text-gray-600 mt-1 bg-gray-50 p-1.5 rounded border border-gray-100">
                                    <span class="font-bold text-gray-800">${bag.subjectCode}</span> (HK: ${bag.semester})<br>
                                    ${scheduleHtml}
                                </div>
                            `;
                        }

                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b">
                                <td class="px-4 md:px-6 py-3 font-semibold text-blue-600 align-top">${bag.code}</td>
                                <td class="px-4 md:px-6 py-3 align-top">${typeLabel}</td>
                                <td class="px-4 md:px-6 py-3 align-top font-medium text-gray-800 truncate max-w-[150px] md:max-w-none" title="${bag.name}">${bag.name}</td>
                                <td class="px-4 md:px-6 py-3 align-top min-w-[200px] hidden sm:table-cell">${extraInfo}</td>
                                <td class="px-4 md:px-6 py-3 text-center align-top whitespace-nowrap">
                                    <button onclick="app.openPrintModal('${bag.id}')" class="text-green-600 bg-green-50 hover:bg-green-100 p-1.5 md:px-2 md:py-1 rounded mx-0.5" title="In nhãn"><i class="fa-solid fa-print"></i></button>
                                    <button onclick="app.editBag('${bag.id}')" class="text-blue-500 mx-0.5 md:mx-1 p-1.5" title="Sửa"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="app.deleteBag('${bag.id}')" class="text-red-500 mx-0.5 md:mx-1 p-1.5" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    }
                });

                document.getElementById('stat-total').innerText = totalBags;
                document.getElementById('stat-value').innerText = "N/A"; 
            }

            updateSemesterFilter() {
                const select = document.getElementById('filterSemester');
                const currentVal = select.value;
                const semesters = [...new Set(this.bags.filter(b => b.type === 'mon_hoc' && b.semester).map(b => b.semester))].sort().reverse();
                
                let options = '<option value="ALL">Tất cả học kỳ</option>';
                semesters.forEach(hk => {
                    options += `<option value="${hk}">Học kỳ ${hk}</option>`;
                });
                select.innerHTML = options;
                
                if (currentVal && semesters.includes(currentVal)) select.value = currentVal;
                else if (semesters.length > 0) select.value = semesters[0]; 
                
                if (!document.getElementById('view-subjects').classList.contains('hidden')) {
                    this.renderSubjects();
                }
            }

            renderSubjects() {
                const tbody = document.getElementById('subjectsTableBody');
                const hkFilter = document.getElementById('filterSemester').value;

                let subjects = this.bags.filter(b => b.type === 'mon_hoc');
                if(hkFilter !== 'ALL') {
                    subjects = subjects.filter(b => b.semester === hkFilter);
                }

                if(subjects.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-gray-500 italic">Không có môn học nào trong học kỳ này.</td></tr>`;
                    return;
                }

                tbody.innerHTML = subjects.map(bag => {
                    let scheduleHtml = '';
                    if(bag.schedules && Array.isArray(bag.schedules)) {
                        scheduleHtml = bag.schedules.map(s => 
                            `<span class="inline-block bg-blue-50 text-blue-700 text-[10px] md:text-xs px-2 py-1 rounded mr-1 mb-1 border border-blue-100 font-medium">
                                ${s.day}, ${s.start} - ${s.end}
                            </span>`
                        ).join('');
                    }

                    return `
                        <tr class="hover:bg-gray-50 border-b transition-colors">
                            <td class="px-4 md:px-6 py-3 font-bold text-gray-800">${bag.subjectCode || 'N/A'}</td>
                            <td class="px-4 md:px-6 py-3 text-gray-700 font-medium truncate max-w-[150px] md:max-w-none" title="${bag.name}">${bag.name}</td>
                            <td class="px-4 md:px-6 py-3 hidden sm:table-cell">${scheduleHtml}</td>
                            <td class="px-4 md:px-6 py-3 text-center font-bold text-blue-600 bg-gray-50/50">${bag.semester || 'N/A'}</td>
                        </tr>
                    `;
                }).join('');
            }

            renderScheduleUI() {
                const container = document.getElementById('scheduleContainer');
                if(this.currentSchedules.length === 0) {
                    container.innerHTML = '<div class="text-xs text-gray-400 text-center italic py-2">Chưa thêm lịch học</div>';
                    return;
                }
                
                container.innerHTML = this.currentSchedules.map((sch, idx) => `
                    <div class="flex flex-wrap gap-1 items-center bg-gray-50 p-2 rounded border border-gray-200">
                        <select id="schDay_${idx}" onchange="app.updateScheduleVal(${idx}, 'day', this.value)" class="w-20 px-1 py-1 border rounded outline-none text-xs">
                            <option value="Thứ 2" ${sch.day==='Thứ 2'?'selected':''}>Thứ 2</option>
                            <option value="Thứ 3" ${sch.day==='Thứ 3'?'selected':''}>Thứ 3</option>
                            <option value="Thứ 4" ${sch.day==='Thứ 4'?'selected':''}>Thứ 4</option>
                            <option value="Thứ 5" ${sch.day==='Thứ 5'?'selected':''}>Thứ 5</option>
                            <option value="Thứ 6" ${sch.day==='Thứ 6'?'selected':''}>Thứ 6</option>
                            <option value="Thứ 7" ${sch.day==='Thứ 7'?'selected':''}>Thứ 7</option>
                            <option value="Chủ nhật" ${sch.day==='Chủ nhật'?'selected':''}>Chủ nhật</option>
                        </select>
                        <input type="time" id="schStart_${idx}" value="${sch.start}" onchange="app.updateScheduleVal(${idx}, 'start', this.value)" class="w-[70px] px-1 py-1 border rounded outline-none text-xs">
                        <span class="text-xs text-gray-500">-</span>
                        <input type="time" id="schEnd_${idx}" value="${sch.end}" onchange="app.updateScheduleVal(${idx}, 'end', this.value)" class="w-[70px] px-1 py-1 border rounded outline-none text-xs">
                        <div class="flex flex-1 items-center gap-1 min-w-[90px]">
                            <input type="text" value="${sch.weeks || ''}" readonly placeholder="Tuần" class="w-full px-1 py-1 text-xs border rounded bg-white text-gray-600 outline-none cursor-pointer" onclick="app.openWeekModal(${idx})" title="Chọn tuần">
                            <button type="button" onclick="app.openWeekModal(${idx})" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-1 rounded">Chọn</button>
                        </div>
                        <button type="button" onclick="app.removeScheduleRow(${idx})" class="text-red-500 hover:text-red-700 px-1 py-1"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `).join('');
            }

            addScheduleRow() {
                this.currentSchedules.push({ day: 'Thứ 2', start: '', end: '', weeks: '' });
                this.renderScheduleUI();
            }

            removeScheduleRow(idx) {
                this.currentSchedules.splice(idx, 1);
                this.renderScheduleUI();
            }

            updateScheduleVal(idx, key, val) {
                if(this.currentSchedules[idx]) {
                    this.currentSchedules[idx][key] = val;
                }
            }

            openModal() {
                document.getElementById('bagForm').reset();
                document.getElementById('bagId').value = '';
                document.getElementById('bagCode').value = this.generateRandomCode();
                document.getElementById('modalTitle').innerText = 'Thêm Clearbag Mới';
                
                this.currentSchedules = [];
                this.renderScheduleUI();

                this.toggleTypeFields();
                document.getElementById('modal').classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('modal').classList.add('hidden');
            }

            editBag(id) {
                const bag = this.bags.find(b => b.id === id);
                if(bag) {
                    document.getElementById('bagId').value = bag.id;
                    document.getElementById('bagCode').value = bag.code;
                    document.getElementById('bagType').value = bag.type || 'tai_lieu';
                    document.getElementById('bagName').value = bag.name;
                    
                    if (bag.type === 'mon_hoc') {
                        document.getElementById('subjectCode').value = bag.subjectCode || '';
                        document.getElementById('semester').value = bag.semester || '';
                        this.currentSchedules = bag.schedules ? JSON.parse(JSON.stringify(bag.schedules)) : [];
                    } else {
                        this.currentSchedules = [];
                    }

                    this.renderScheduleUI();
                    this.toggleTypeFields();
                    document.getElementById('modalTitle').innerText = 'Cập nhật Clearbag';
                    document.getElementById('modal').classList.remove('hidden');
                }
            }

            async saveData() {
                const idInput = document.getElementById('bagId').value;
                const codeInput = document.getElementById('bagCode').value;
                const typeInput = document.getElementById('bagType').value;
                const nameInput = document.getElementById('bagName').value.trim();

                if(!nameInput) return alert("Vui lòng nhập tên túi!");

                let dataToSave = {
                    code: codeInput,
                    type: typeInput,
                    name: nameInput
                };

                if (typeInput === 'mon_hoc') {
                    const subjCode = document.getElementById('subjectCode').value.trim().toUpperCase();
                    if (subjCode.length !== 6) return alert("Mã môn học phải có đúng 6 ký tự!");
                    
                    const isDuplicate = this.bags.some(b => b.type === 'mon_hoc' && b.subjectCode === subjCode && b.id !== idInput);
                    if (isDuplicate) return alert(`Mã môn học ${subjCode} đã tồn tại trong kho! Vui lòng nhập mã khác.`);
                    
                    if (this.currentSchedules.length === 0) return alert("Vui lòng thêm ít nhất 1 buổi học!");
                    for(let i=0; i<this.currentSchedules.length; i++) {
                        let s = this.currentSchedules[i];
                        if(!s.start || !s.end) return alert(`Vui lòng chọn đầy đủ thời gian ở dòng lịch học số ${i+1}`);
                    }

                    dataToSave.subjectCode = subjCode;
                    dataToSave.semester = document.getElementById('semester').value;
                    dataToSave.schedules = this.currentSchedules;
                }

                const key = idInput || codeInput;
                await set(ref(this.db, 'clearbags/' + key), dataToSave);
                this.closeModal();
            }

            async deleteBag(id) {
                if(confirm('Bạn có chắc muốn xóa túi này?')) {
                    await remove(ref(this.db, 'clearbags/' + id));
                }
            }

            // --- XỬ LÝ CHỌN TUẦN ---
            openWeekModal(idx) {
                this.currentScheduleIndex = idx;
                
                const currentSemester = document.getElementById('semester').value;
                document.getElementById('weekModalSemester').innerText = `HK: ${currentSemester || 'N/A'}`;

                const currentISOWeek = this.getCurrentISOWeek();
                const startWeek = Math.max(1, currentISOWeek - 3);
                const endWeek = Math.min(52, startWeek + 19);

                const grid = document.getElementById('weekGrid');
                let html = '';
                for(let i = startWeek; i <= endWeek; i++) {
                    const isCurrent = i === currentISOWeek ? 'ring-2 ring-red-400' : '';
                    html += `
                        <label class="flex flex-col items-center justify-center p-2 border rounded-lg cursor-pointer hover:bg-blue-50 transition-colors bg-gray-50 border-gray-200 ${isCurrent}" title="${i === currentISOWeek ? 'Tuần hiện tại' : ''}">
                            <input type="checkbox" value="${i}" class="week-cb w-4 h-4 text-blue-600 rounded mb-1">
                            <span class="text-xs font-medium text-gray-700">T${i}</span>
                        </label>`;
                }
                grid.innerHTML = html;

                // Bind logic đổi màu
                document.querySelectorAll('.week-cb').forEach(cb => {
                    cb.addEventListener('change', (e) => {
                        const label = e.target.closest('label');
                        if(e.target.checked) {
                            label.classList.add('bg-blue-50', 'border-blue-300');
                            label.classList.remove('bg-gray-50', 'border-gray-200');
                        } else {
                            label.classList.remove('bg-blue-50', 'border-blue-300');
                            label.classList.add('bg-gray-50', 'border-gray-200');
                        }
                    });
                });

                document.getElementById('weekModal').classList.remove('hidden');
            }

            closeWeekModal() {
                document.getElementById('weekModal').classList.add('hidden');
                this.currentScheduleIndex = null;
            }

            saveWeeks() {
                if (this.currentScheduleIndex === null || this.currentScheduleIndex === undefined) {
                    this.closeWeekModal();
                    return;
                }
                const cbs = document.querySelectorAll('.week-cb:checked');
                const weeks = Array.from(cbs).map(cb => cb.value);
                
                // Thuật toán gộp tuần liên tiếp (VD: 35,36,37, 45,46 -> 35-37, 45-46)
                let grouped = [];
                if (weeks.length > 0) {
                    let start = parseInt(weeks[0]);
                    let prev = start;
                    for (let i = 1; i <= weeks.length; i++) {
                        let current = parseInt(weeks[i]);
                        if (current === prev + 1) {
                            prev = current;
                        } else {
                            grouped.push(start === prev ? `${start}` : `${start}-${prev}`);
                            start = current;
                            prev = current;
                        }
                    }
                }
                
                if (this.currentSchedules[this.currentScheduleIndex]) {
                    this.currentSchedules[this.currentScheduleIndex].weeks = grouped.join(',');
                }
                
                this.renderScheduleUI();
                this.closeWeekModal();
            }

           // --- XỬ LÝ QUÉT MÃ BẰNG CAMERA ---
            openScanModal() {
                const modal = document.getElementById('scanModal');
                modal.classList.remove('hidden');

                // Nếu đang chạy thì không khởi tạo lại để tránh đơ
                if (this.html5QrcodeScanner && this.html5QrcodeScanner.getState() === 2) {
                    return;
                }

                // Luôn tạo một instance mới mỗi lần mở để quét mượt hơn
                this.html5QrcodeScanner = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };
                
                this.html5QrcodeScanner.start(
                    { facingMode: "environment" }, 
                    config, 
                    (decodedText) => {
                        // Kêu bíp nhẹ
                        try {
                            const ctx = new (window.AudioContext || window.webkitAudioContext)();
                            const osc = ctx.createOscillator();
                            osc.connect(ctx.destination);
                            osc.frequency.value = 1200;
                            osc.start();
                            setTimeout(() => osc.stop(), 100);
                        } catch(e) {}

                        // Tạm dừng quét
                        if (this.html5QrcodeScanner.getState() === 2) { // 2 = SCANNING
                            this.html5QrcodeScanner.pause(true);
                        }

                        // Xử lý kiểm tra túi
                        this.checkBagForToday(decodedText);
                    },
                    (errorMessage) => {
                        // Bỏ qua lỗi ồn (noise error)
                    }
                ).catch((err) => {
                    console.log("Lỗi Camera:", err);
                    Swal.fire({
                        icon: 'error',
                        title: 'Lỗi truy cập Camera',
                        text: 'Trình duyệt không tìm thấy camera hoặc bị từ chối quyền truy cập.'
                    });
                    this.closeScanModal();
                });
            }

            closeScanModal() {
                document.getElementById('scanModal').classList.add('hidden');
                if (this.html5QrcodeScanner) {
                    // Dùng Promise để đảm bảo stop hoàn toàn
                    this.html5QrcodeScanner.stop().then(() => {
                        this.html5QrcodeScanner.clear();
                        this.html5QrcodeScanner = null;
                    }).catch(err => {
                        console.log("Failed to stop scanner:", err);
                        this.html5QrcodeScanner = null;
                    });
                }
            }

            checkBagForToday(bagCode) {
                const cleanCode = bagCode.trim().toUpperCase();
                const bag = this.bags.find(b => b.code.toUpperCase() === cleanCode);
                
                const swalConfig = {
                    confirmButtonText: 'Quét tiếp',
                    confirmButtonColor: '#3085d6',
                    allowOutsideClick: false,
                    willClose: () => {
                        // Resume quét sau khi tắt popup
                        if (this.html5QrcodeScanner && this.html5QrcodeScanner.getState() === 3) { // 3 = PAUSED
                            this.html5QrcodeScanner.resume();
                        }
                    }
                };

                if (!bag) {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'error',
                        title: 'TÚI KHÔNG TỒN TẠI',
                        html: `Mã <b>${cleanCode}</b> không có trong hệ thống!`
                    });
                    return;
                }

                if (bag.type === 'tai_lieu') {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'info',
                        title: 'TÀI LIỆU CHUNG',
                        text: bag.name
                    });
                    return;
                }

                const currentWeek = this.getCurrentISOWeek();
                const currentDay = this.getCurrentDayString();
                let isCorrectForToday = false;
                
                if (bag.schedules && bag.schedules.length > 0) {
                    for(let sch of bag.schedules) {
                        const validWeeks = this.parseWeeks(sch.weeks);
                        if (sch.day === currentDay && validWeeks.includes(currentWeek)) {
                            isCorrectForToday = true;
                            break;
                        }
                    }
                }

                if (isCorrectForToday) {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'success',
                        title: 'ĐÚNG MÔN HỌC',
                        html: `
                            <div class="text-xl font-bold text-green-700 mb-2">${bag.name}</div>
                            <div class="text-sm">Hôm nay có lịch học môn này!</div>
                        `
                    });
                } else {
                    Swal.fire({
                        ...swalConfig,
                        icon: 'warning',
                        title: 'SAI LỊCH MÔN HỌC!',
                        html: `
                            <div class="text-lg font-bold text-red-600 mb-2">${bag.name}</div>
                            <div class="text-sm">Môn này <b>KHÔNG CÓ</b> lịch vào <b>${currentDay}</b> (Tuần ${currentWeek}).</div>
                        `
                    });
                }
            }
            // --- XỬ LÝ IN ẤN ---
            openPrintModal(id) {
                this.currentPrintId = id;
                document.getElementById('printOnlyQR').checked = false; // Reset checkbox
                document.getElementById('printModal').classList.remove('hidden');
            }

            closePrintModal() {
                document.getElementById('printModal').classList.add('hidden');
            }

            executePrint() {
                const size = document.getElementById('printSize').value;
                const [w, h] = size.split('x');
                const bag = this.bags.find(b => b.id === this.currentPrintId);
                if(!bag) return;

                const printOnlyQR = document.getElementById('printOnlyQR').checked;
                const safeW = parseInt(w) - 2;
                const safeH = parseInt(h) - 2;
                
                let content = '';
                
                if (printOnlyQR) {
                    // Cấu trúc CHỈ IN MÃ QR CODE
                    const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(bag.code)}&margin=0`;
                    content = `
                        <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%;">
                            <img src="${qrApiUrl}" style="max-width: 80%; max-height: 80%; object-fit: contain;">
                            <div style="font-size: 7pt; font-family: monospace; font-weight: bold; margin-top: 2mm;">${bag.code}</div>
                        </div>
                    `;
                } else {
                    // IN ĐẦY ĐỦ NHƯ CŨ
                    const now = new Date();
                    const timeStr = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

                    if (bag.type === 'tai_lieu') {
                        content = `
                            <div style="font-weight:bold; font-size:9pt; text-align:center; margin-bottom: 1.5mm; border-bottom: 1px dashed #333; padding-bottom: 1mm;">BÌA ĐỰNG TÀI LIỆU</div>
                            <div style="font-size:7pt; margin-bottom: 1.5mm; padding: 0 0.5mm; line-height: 1.15; flex-grow: 1; word-break: break-word; white-space: normal;"><b>Tên:</b> ${bag.name}</div>
                            <div style="font-size:7.5pt; margin-bottom: 1.5mm; padding: 0 0.5mm; line-height: 1.1;"><b>Mã túi:</b> <span style="font-family: monospace; font-weight:bold;">${bag.code}</span></div>
                            <div style="font-size:5.5pt; text-align:right; font-style: italic; color: #555; padding-top: 1mm; border-top: 1px dashed #ccc;">In: ${timeStr}</div>
                        `;
                    } else {
                        let schStr = (bag.schedules || []).map(s => `${s.day} (${s.start.replace(':00', 'h')})`).join(', ');
                        content = `
                            <div style="font-weight:bold; font-size:9pt; text-align:center; margin-bottom: 1.5mm; border-bottom: 1px dashed #333; padding-bottom: 1mm;">BÌA TÀI LIỆU</div>
                            <div style="font-size:7pt; margin-bottom: 1mm; padding: 0 0.5mm; line-height: 1.15; max-height: 3.5em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word; white-space: normal;"><b>MH:</b> ${bag.name}</div>
                            <div style="font-size:7.5pt; margin-bottom: 1mm; padding: 0 0.5mm; line-height: 1.1;"><b>Mã túi:</b> <span style="font-family: monospace; font-weight:bold;">${bag.code}</span></div>
                            <div style="font-size:6.5pt; margin-bottom: 1mm; padding: 0 0.5mm; line-height: 1.1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; white-space: normal;"><b>Lịch:</b> ${schStr}</div>
                            <div style="font-size:5.5pt; margin-top: auto; text-align:right; font-style: italic; color: #555; padding-top: 0.5mm; border-top: 1px dashed #ccc;">In: ${timeStr}</div>
                        `;
                    }
                }

                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <!DOCTYPE html>
                    <html><head>
                    <title>In Nhãn - ${bag.code}</title>
                    <style>
                        @page { size: ${w}mm ${h}mm landscape; margin: 0 !important; }
                        html, body { margin: 0; padding: 0; width: ${w}mm; height: ${h}mm; background: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
                        
                        .label-container {
                            width: ${safeW}mm; 
                            height: ${safeH}mm; 
                            box-sizing: border-box; 
                            padding: 1mm 1.5mm;
                            font-family: 'Arial', sans-serif; 
                            display: flex; 
                            flex-direction: column; 
                            -webkit-print-color-adjust: exact; 
                            print-color-adjust: exact;
                        }
                    </style>
                    </head><body>
                        <div class="label-container">
                            ${content}
                        </div>
                    <script>
                        window.onload = function() {
                            setTimeout(() => { window.print(); window.close(); }, 500);
                        };
                    <\/script>
                    </body></html>
                `);
                printWindow.document.close();
                this.closePrintModal();
            }
        }
        
        window.app = new ClearbagApp();
    </script>
</body>
</html>
