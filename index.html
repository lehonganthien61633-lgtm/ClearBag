<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Clearbag</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="bg-slate-800 text-white w-64 flex flex-col hidden md:flex">
        <div class="p-5 border-b border-slate-700 text-xl font-bold flex items-center gap-2">
            <i class="fa-regular fa-folder-open text-blue-400"></i> Kho Clearbag
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="app.switchView('dashboard')" id="nav-dashboard" class="nav-btn w-full text-left px-4 py-3 rounded bg-blue-600 text-white"><i class="fa-solid fa-chart-pie w-6"></i> Tổng quan</button>
            <button onclick="app.switchView('clearbags')" id="nav-clearbags" class="nav-btn w-full text-left px-4 py-3 rounded text-gray-300 hover:bg-slate-700 hover:text-white"><i class="fa-solid fa-box w-6"></i> Clearbag</button>
            <button onclick="app.switchView('subjects')" id="nav-subjects" class="nav-btn w-full text-left px-4 py-3 rounded text-gray-300 hover:bg-slate-700 hover:text-white"><i class="fa-solid fa-book w-6"></i> Quản lý môn học</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center z-10">
            <h2 id="pageTitle" class="text-xl font-bold">Tổng quan</h2>
            <button onclick="app.openModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">
                <i class="fa-solid fa-plus"></i> Thêm Túi Mới
            </button>
        </header>

        <div class="p-6 overflow-y-auto flex-1">
            
            <!-- Dashboard View -->
            <div id="view-dashboard" class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                        <p class="text-gray-500 text-sm">Tổng số lượng túi</p>
                        <p id="stat-total" class="text-3xl font-bold">0</p>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                        <p class="text-gray-500 text-sm">Tổng giá trị</p>
                        <p id="stat-value" class="text-3xl font-bold">0 ₫</p>
                    </div>
                </div>
            </div>

            <!-- Clearbags View -->
            <div id="view-clearbags" class="hidden bg-white rounded-xl shadow-sm border border-gray-200">
                <div class="p-4 border-b border-gray-200">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm tên, mã túi..." class="w-full md:w-1/3 px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-500 text-sm">
                        <tr>
                            <th class="px-6 py-3 font-medium">Mã</th>
                            <th class="px-6 py-3 font-medium">Phân loại</th>
                            <th class="px-6 py-3 font-medium">Tên Clearbag</th>
                            <th class="px-6 py-3 font-medium">Thông tin Môn học</th>
                            <th class="px-6 py-3 font-medium text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <!-- Subjects View (Read-only) -->
            <div id="view-subjects" class="hidden bg-white rounded-xl shadow-sm border border-gray-200">
                <div class="p-4 border-b border-gray-200 flex gap-4 items-center bg-gray-50 rounded-t-xl">
                    <label class="font-bold text-gray-700">Chọn Học Kỳ:</label>
                    <select id="filterSemester" onchange="app.renderSubjects()" class="px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 font-semibold text-blue-700 min-w-[150px]">
                        <!-- Sẽ render tự động qua JS -->
                    </select>
                </div>
                <table class="w-full text-left">
                    <thead class="bg-gray-100 text-gray-600 text-sm">
                        <tr>
                            <th class="px-6 py-3 font-medium">Mã MH</th>
                            <th class="px-6 py-3 font-medium">Tên Môn Học (Clearbag)</th>
                            <th class="px-6 py-3 font-medium">Lịch học</th>
                            <th class="px-6 py-3 font-medium text-center">Học kỳ</th>
                        </tr>
                    </thead>
                    <tbody id="subjectsTableBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
            <h3 class="text-lg font-bold mb-4" id="modalTitle">Thêm Clearbag</h3>
            <form id="bagForm" class="space-y-4" onsubmit="return false;">
                <input type="hidden" id="bagId">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Mã Túi</label>
                    <input type="text" id="bagCode" readonly class="w-full px-3 py-2 border rounded bg-gray-100 text-gray-600 outline-none cursor-not-allowed font-bold">
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1">
                        <label class="block text-sm font-medium text-gray-700">Phân loại *</label>
                        <select id="bagType" onchange="app.toggleTypeFields()" class="w-full px-3 py-2 border rounded outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="mon_hoc">Môn học</option>
                            <option value="tai_lieu">Tài liệu</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700">Tên Clearbag *</label>
                        <input type="text" id="bagName" required class="w-full px-3 py-2 border rounded outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                
                <!-- Các trường hiển thị thêm nếu chọn Môn học -->
                <div id="subjectFields" class="p-3 bg-blue-50 rounded border border-blue-100 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Mã MH (6 ký tự) *</label>
                            <input type="text" id="subjectCode" maxlength="6" class="w-full px-3 py-2 border rounded outline-none focus:ring-2 focus:ring-blue-500 uppercase" placeholder="VD: CH1001">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Học kỳ (Tự động)</label>
                            <input type="text" id="semester" readonly class="w-full px-3 py-2 border rounded bg-gray-100 text-gray-600 outline-none font-bold">
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-sm font-medium text-gray-700">Lịch học *</label>
                            <button type="button" onclick="app.addScheduleRow()" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded hover:bg-green-200 font-semibold"><i class="fa-solid fa-plus"></i> Thêm ngày</button>
                        </div>
                        <div id="scheduleContainer" class="space-y-2 max-h-32 overflow-y-auto no-scrollbar border p-2 rounded bg-white">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="app.closeModal()" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Hủy</button>
                    <button type="button" onclick="app.saveData()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Lưu lại</button>
                </div>
            </form>
        </div>
    </div>
    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        class ClearbagApp {
            constructor() {
                this.bags = [];
                this.search = '';
                this.currentSchedules = []; // Lưu trữ mảng lịch học khi nhập
                
                // Cấu hình Database
                const firebaseConfig = { 
                    databaseURL: "https://clearbag-188b6-default-rtdb.asia-southeast1.firebasedatabase.app/" 
                };
                const fbApp = initializeApp(firebaseConfig);
                this.db = getDatabase(fbApp);
                this.bagsRef = ref(this.db, 'clearbags');

                this.init();
            }

            init() {
                onValue(this.bagsRef, (snapshot) => {
                    this.bags = [];
                    if (snapshot.exists()) {
                        snapshot.forEach((child) => {
                            this.bags.push({ id: child.key, ...child.val() });
                        });
                    }
                    this.render();
                    this.updateSemesterFilter(); // Cập nhật dropdown ở View Môn học
                });

                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.search = e.target.value.toLowerCase();
                    this.render();
                });

                // Ép mã MH viết hoa, không dấu
                document.getElementById('subjectCode').addEventListener('input', function(e) {
                    let val = e.target.value;
                    val = val.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                    val = val.replace(/[^A-Za-z0-9]/g, '');
                    e.target.value = val.toUpperCase();
                });
            }

            switchView(view) {
                // UI cập nhật nút menu
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('bg-blue-600', 'text-white');
                    btn.classList.add('text-gray-300', 'hover:bg-slate-700', 'hover:text-white');
                });
                document.getElementById(`nav-${view}`).classList.remove('text-gray-300', 'hover:bg-slate-700');
                document.getElementById(`nav-${view}`).classList.add('bg-blue-600', 'text-white');

                // Đổi màn hình
                document.getElementById('view-dashboard').classList.add('hidden');
                document.getElementById('view-clearbags').classList.add('hidden');
                document.getElementById('view-subjects').classList.add('hidden');
                
                document.getElementById(`view-${view}`).classList.remove('hidden');
                
                const titles = { 'dashboard': 'Tổng quan', 'clearbags': 'Danh sách Clearbag', 'subjects': 'Quản lý Môn học' };
                document.getElementById('pageTitle').innerText = titles[view];

                if(view === 'subjects') this.renderSubjects();
            }

            toggleTypeFields() {
                const type = document.getElementById('bagType').value;
                const subjectFields = document.getElementById('subjectFields');
                if (type === 'mon_hoc') {
                    subjectFields.classList.remove('hidden');
                    document.getElementById('semester').value = this.calculateSemester();
                } else {
                    subjectFields.classList.add('hidden');
                }
            }

            calculateSemester() {
                const now = new Date();
                const month = now.getMonth() + 1; 
                const year = now.getFullYear();
                let startYearShort = '';
                let semesterSuffix = '';

                if (month >= 9 && month <= 12) {
                    startYearShort = year.toString().slice(-2);
                    semesterSuffix = '1';
                } else if (month >= 1 && month < 6) {
                    startYearShort = (year - 1).toString().slice(-2);
                    semesterSuffix = '2';
                } else if (month >= 6 && month < 9) {
                    startYearShort = (year - 1).toString().slice(-2);
                    semesterSuffix = '3';
                }
                return `${startYearShort}${semesterSuffix}`;
            }

            generateRandomCode() {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let res = 'CB-';
                for(let i=0; i<5; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
                return res;
            }

            render() {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                let totalBags = 0;

                this.bags.forEach(bag => {
                    totalBags++;
                    if (bag.name.toLowerCase().includes(this.search) || bag.code.toLowerCase().includes(this.search)) {
                        const typeLabel = bag.type === 'mon_hoc' ? '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">Môn học</span>' : '<span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs font-bold">Tài liệu</span>';
                        
                        let extraInfo = '';
                        if (bag.type === 'mon_hoc') {
                            let scheduleHtml = '';
                            if(bag.schedules && Array.isArray(bag.schedules)) {
                                scheduleHtml = bag.schedules.map(s => {
                                    const wInfo = s.weeks ? `<span class="text-[10px] bg-yellow-100 text-yellow-800 px-1 rounded ml-1">Tuần: ${s.weeks}</span>` : '';
                                    return `<div class="mt-0.5"><i class="fa-regular fa-clock w-3"></i> ${s.day}, ${s.start} - ${s.end} ${wInfo}</div>`;
                                }).join('');
                            }
                            extraInfo = `
                                <div class="text-xs text-gray-600 mt-1 bg-gray-50 p-1.5 rounded border border-gray-100">
                                    <span class="font-bold text-gray-800">${bag.subjectCode}</span> (HK: ${bag.semester})<br>
                                    ${scheduleHtml}
                                </div>
                            `;
                        }

                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b">
                                <td class="px-6 py-4 font-semibold text-blue-600 align-top">${bag.code}</td>
                                <td class="px-6 py-4 align-top whitespace-nowrap">${typeLabel}</td>
                                <td class="px-6 py-4 align-top font-medium text-gray-800">${bag.name}</td>
                                <td class="px-6 py-4 align-top min-w-[200px]">${extraInfo}</td>
                                <td class="px-6 py-4 text-center align-top whitespace-nowrap">
                                    <button onclick="app.openPrintModal('${bag.id}')" class="text-green-600 bg-green-50 hover:bg-green-100 px-2 py-1 rounded mx-1" title="In nhãn"><i class="fa-solid fa-print"></i></button>
                                    <button onclick="app.editBag('${bag.id}')" class="text-blue-500 mx-1" title="Sửa"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="app.deleteBag('${bag.id}')" class="text-red-500 mx-1" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    }
                });

                document.getElementById('stat-total').innerText = totalBags;
                document.getElementById('stat-value').innerText = "N/A"; 
            }

            // ------------------------------------------
            // Tính năng Mới: VIEW Môn Học (Chỉ xem)
            // ------------------------------------------
            updateSemesterFilter() {
                const select = document.getElementById('filterSemester');
                const currentVal = select.value;
                const semesters = [...new Set(this.bags.filter(b => b.type === 'mon_hoc' && b.semester).map(b => b.semester))].sort().reverse();
                
                select.innerHTML = '<option value="ALL">Tất cả học kỳ</option>';
                semesters.forEach(hk => {
                    select.innerHTML += `<option value="${hk}">Học kỳ ${hk}</option>`;
                });
                
                if (currentVal && semesters.includes(currentVal)) select.value = currentVal;
                else if (semesters.length > 0) select.value = semesters[0]; // Mặc định HK mới nhất
                
                if (document.getElementById('view-subjects').classList.contains('hidden') === false) {
                    this.renderSubjects();
                }
            }

            renderSubjects() {
                const tbody = document.getElementById('subjectsTableBody');
                tbody.innerHTML = '';
                const hkFilter = document.getElementById('filterSemester').value;

                let subjects = this.bags.filter(b => b.type === 'mon_hoc');
                if(hkFilter !== 'ALL') {
                    subjects = subjects.filter(b => b.semester === hkFilter);
                }

                if(subjects.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-gray-500 italic">Không có môn học nào trong học kỳ này.</td></tr>`;
                    return;
                }

                subjects.forEach(bag => {
                    let scheduleHtml = '';
                    if(bag.schedules && Array.isArray(bag.schedules)) {
                        scheduleHtml = bag.schedules.map(s => `<span class="inline-block bg-blue-50 text-blue-700 text-xs px-2 py-1 rounded mr-1 mb-1 border border-blue-100">${s.day}, ${s.start} - ${s.end}</span>`).join('');
                    }

                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b">
                            <td class="px-6 py-4 font-bold text-gray-800">${bag.subjectCode}</td>
                            <td class="px-6 py-4 text-gray-700">${bag.name}</td>
                            <td class="px-6 py-4">${scheduleHtml}</td>
                            <td class="px-6 py-4 text-center font-semibold text-blue-600">${bag.semester}</td>
                        </tr>
                    `;
                });
            }

            renderScheduleUI() {
                const container = document.getElementById('scheduleContainer');
                container.innerHTML = '';
                if(this.currentSchedules.length === 0) {
                    container.innerHTML = '<div class="text-xs text-gray-400 text-center italic py-2">Chưa thêm lịch học</div>';
                    return;
                }
                
                this.currentSchedules.forEach((sch, idx) => {
                    container.innerHTML += `
                        <div class="flex flex-wrap gap-1 items-center bg-gray-50 p-2 rounded border border-gray-200">
                            <select id="schDay_${idx}" onchange="app.updateScheduleVal(${idx}, 'day', this.value)" class="w-20 px-1 py-1 border rounded outline-none text-xs">
                                <option value="Thứ 2" ${sch.day==='Thứ 2'?'selected':''}>Thứ 2</option>
                                <option value="Thứ 3" ${sch.day==='Thứ 3'?'selected':''}>Thứ 3</option>
                                <option value="Thứ 4" ${sch.day==='Thứ 4'?'selected':''}>Thứ 4</option>
                                <option value="Thứ 5" ${sch.day==='Thứ 5'?'selected':''}>Thứ 5</option>
                                <option value="Thứ 6" ${sch.day==='Thứ 6'?'selected':''}>Thứ 6</option>
                                <option value="Thứ 7" ${sch.day==='Thứ 7'?'selected':''}>Thứ 7</option>
                                <option value="Chủ nhật" ${sch.day==='Chủ nhật'?'selected':''}>Chủ nhật</option>
                            </select>
                            <input type="time" id="schStart_${idx}" value="${sch.start}" onchange="app.updateScheduleVal(${idx}, 'start', this.value)" class="w-[70px] px-1 py-1 border rounded outline-none text-xs">
                            <span class="text-xs text-gray-500">-</span>
                            <input type="time" id="schEnd_${idx}" value="${sch.end}" onchange="app.updateScheduleVal(${idx}, 'end', this.value)" class="w-[70px] px-1 py-1 border rounded outline-none text-xs">
                            <div class="flex flex-1 items-center gap-1 min-w-[100px]">
                                <input type="text" id="schWeeks_${idx}" value="${sch.weeks || ''}" readonly placeholder="Tuần" class="w-full px-1 py-1 text-xs border rounded bg-white text-gray-600 outline-none cursor-pointer" onclick="app.openWeekModal(${idx})" title="Bấm để chọn tuần">
                                <button type="button" onclick="app.openWeekModal(${idx})" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-1 rounded">Chọn</button>
                            </div>
                            <button type="button" onclick="app.removeScheduleRow(${idx})" class="text-red-500 hover:text-red-700 px-1 py-1"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                });
            }

            addScheduleRow() {
                this.currentSchedules.push({ day: 'Thứ 2', start: '', end: '', weeks: '' });
                this.renderScheduleUI();
            }

            removeScheduleRow(idx) {
                this.currentSchedules.splice(idx, 1);
                this.renderScheduleUI();
            }

            updateScheduleVal(idx, key, val) {
                if(this.currentSchedules[idx]) {
                    this.currentSchedules[idx][key] = val;
                }
            }

            // ------------------------------------------
            // Modal Tương tác
            // ------------------------------------------
            openModal() {
                document.getElementById('bagForm').reset();
                document.getElementById('bagId').value = '';
                document.getElementById('bagCode').value = this.generateRandomCode();
                document.getElementById('modalTitle').innerText = 'Thêm Clearbag';
                
                this.currentSchedules = [];
                this.renderScheduleUI();

                this.toggleTypeFields();
                document.getElementById('modal').classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('modal').classList.add('hidden');
            }

            editBag(id) {
                const bag = this.bags.find(b => b.id === id);
                if(bag) {
                    document.getElementById('bagId').value = bag.id;
                    document.getElementById('bagCode').value = bag.code;
                    document.getElementById('bagType').value = bag.type || 'tai_lieu';
                    document.getElementById('bagName').value = bag.name;
                    
                    if (bag.type === 'mon_hoc') {
                        document.getElementById('subjectCode').value = bag.subjectCode || '';
                        document.getElementById('semester').value = bag.semester || '';
                        this.currentSchedules = bag.schedules ? JSON.parse(JSON.stringify(bag.schedules)) : [];
                    } else {
                        this.currentSchedules = [];
                    }

                    this.renderScheduleUI();
                    this.toggleTypeFields();
                    document.getElementById('modalTitle').innerText = 'Cập nhật Clearbag';
                    document.getElementById('modal').classList.remove('hidden');
                }
            }

            async saveData() {
                const idInput = document.getElementById('bagId').value;
                const codeInput = document.getElementById('bagCode').value;
                const typeInput = document.getElementById('bagType').value;
                const nameInput = document.getElementById('bagName').value.trim();

                if(!nameInput) return alert("Vui lòng nhập tên túi!");

                let dataToSave = {
                    code: codeInput,
                    type: typeInput,
                    name: nameInput
                };

                if (typeInput === 'mon_hoc') {
                    const subjCode = document.getElementById('subjectCode').value.trim().toUpperCase();
                    if (subjCode.length !== 6) return alert("Mã môn học phải có đúng 6 ký tự!");
                    
                    // CHỐNG TRÙNG MÃ MÔN HỌC
                    const isDuplicate = this.bags.some(b => b.type === 'mon_hoc' && b.subjectCode === subjCode && b.id !== idInput);
                    if (isDuplicate) return alert(`Mã môn học ${subjCode} đã tồn tại trong kho! Vui lòng nhập mã khác.`);
                    
                    if (this.currentSchedules.length === 0) return alert("Vui lòng thêm ít nhất 1 buổi học!");
                    for(let i=0; i<this.currentSchedules.length; i++) {
                        let s = this.currentSchedules[i];
                        if(!s.start || !s.end) return alert(`Vui lòng chọn đầy đủ thời gian ở dòng lịch học số ${i+1}`);
                    }

                    dataToSave.subjectCode = subjCode;
                    dataToSave.semester = document.getElementById('semester').value;
                    dataToSave.schedules = this.currentSchedules;
                }

                const key = idInput || codeInput;
                await set(ref(this.db, 'clearbags/' + key), dataToSave);
                this.closeModal();
            }

            async deleteBag(id) {
                if(confirm('Bạn có chắc muốn xóa túi này?')) {
                    await remove(ref(this.db, 'clearbags/' + id));
                }
            }

            // ------------------------------------------
            // Xử lý Modal Chọn Tuần
            // ------------------------------------------
            openWeekModal(idx) {
                this.currentScheduleIndex = idx;
                const sch = this.currentSchedules[idx];
                const selectedWeeks = sch.weeks ? sch.weeks.split(',').map(Number) : [];
                const grid = document.getElementById('weekGrid');
                grid.innerHTML = '';
                for(let i=1; i<=25; i++) {
                    const checked = selectedWeeks.includes(i) ? 'checked' : '';
                    grid.innerHTML += `
                        <label class="flex items-center gap-1.5 text-sm border p-2 rounded cursor-pointer hover:bg-blue-50 transition-colors">
                            <input type="checkbox" value="${i}" class="week-cb w-4 h-4 text-blue-600 rounded" ${checked}> T${i}
                        </label>`;
                }
                document.getElementById('weekModal').classList.remove('hidden');
            }

            closeWeekModal() {
                document.getElementById('weekModal').classList.add('hidden');
            }

            saveWeeks() {
                const cbs = document.querySelectorAll('.week-cb:checked');
                const weeks = Array.from(cbs).map(cb => cb.value).join(',');
                this.currentSchedules[this.currentScheduleIndex].weeks = weeks;
                this.renderScheduleUI();
                this.closeWeekModal();
            }

            // ------------------------------------------
            // Xử lý Modal In Nhãn
            // ------------------------------------------
            openPrintModal(id) {
                this.currentPrintId = id;
                document.getElementById('printModal').classList.remove('hidden');
            }

            closePrintModal() {
                document.getElementById('printModal').classList.add('hidden');
            }

            executePrint() {
                const size = document.getElementById('printSize').value;
                const [w, h] = size.split('x');
                const bag = this.bags.find(b => b.id === this.currentPrintId);
                if(!bag) return;

                const now = new Date();
                const timeStr = `${now.getDate().toString().padStart(2,'0')}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getFullYear()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

                let content = '';
                if (bag.type === 'tai_lieu') {
                    content = `
                        <div style="font-weight:bold; font-size:11pt; text-align:center; margin-bottom: 2mm; border-bottom: 1px dashed #000; padding-bottom: 1mm;">BÌA ĐỰNG TÀI LIỆU</div>
                        <div style="font-size:9pt; margin-bottom: 1.5mm;"><b>Tên:</b> ${bag.name}</div>
                        <div style="font-size:9pt; margin-bottom: 1.5mm;"><b>Mã túi:</b> ${bag.code}</div>
                        <div style="font-size:7pt; margin-top: auto; text-align:right; font-style: italic;">In lúc: ${timeStr}</div>
                    `;
                } else {
                    let schStr = (bag.schedules || []).map(s => `${s.day} (${s.start}-${s.end})`).join(', ');
                    content = `
                        <div style="font-weight:bold; font-size:11pt; text-align:center; margin-bottom: 2mm; border-bottom: 1px dashed #000; padding-bottom: 1mm;">BÌA ĐỰNG TÀI LIỆU</div>
                        <div style="font-size:9pt; margin-bottom: 1mm;"><b>Tên MH:</b> ${bag.name}</div>
                        <div style="font-size:9pt; margin-bottom: 1mm;"><b>Mã túi:</b> ${bag.code}</div>
                        <div style="font-size:8pt; margin-bottom: 1mm;"><b>Lịch:</b> ${schStr}</div>
                        <div style="font-size:7pt; margin-top: auto; text-align:right; font-style: italic;">In lúc: ${timeStr}</div>
                    `;
                }

                const printWindow = window.open('', '_blank');
                printWindow.document.write(`
                    <html><head><title>In Nhãn ${bag.code}</title><style>
                        @page { size: ${w}mm ${h}mm landscape; margin: 0; }
                        body { margin: 0; padding: 2mm; width: ${w}mm; height: ${h}mm; box-sizing: border-box; font-family: sans-serif; display: flex; flex-direction: column; -webkit-print-color-adjust: exact; print-color-adjust: exact;}
                    </style></head><body>${content}
                    <script>
                        window.onload = function() {
                            setTimeout(() => { window.print(); window.close(); }, 300);
                        };
                    <\/script>
                    </body></html>
                `);
                printWindow.document.close();
                this.closePrintModal();
            }
        }
        window.app = new ClearbagApp();
    </script>
</body>
</html>
